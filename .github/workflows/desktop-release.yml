name: Desktop release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac-arm64:
    name: Comote macOS arm64 DMG
    runs-on: macos-14
    # Stable tags use the protected signing environment. Main-branch builds use
    # a separate environment with no signing secrets and produce unsigned DMGs.
    environment: ${{ github.ref_type == 'tag' && 'release-signing' || 'prerelease' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Only set up signing when the secrets exist (forks / pre-config builds
      # fall through to an unsigned DMG instead of failing).
      - name: Detect signing availability
        id: cfg
        env:
          HAS_CERT: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE != '' }}
        run: echo "signing=$HAS_CERT" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keychain + notary key
        if: steps.cfg.outputs.signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/comote-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Make the temp keychain visible to codesign without dropping the login one.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Notary API key (.p8) → file for notarytool.
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          echo "COMOTE_NOTARY_KEY_PATH=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build DMG
        env:
          # Empty when unsigned → sign-macos-app.mjs no-ops.
          COMOTE_SIGNING_IDENTITY: ${{ github.ref_type == 'tag' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: npm run dist:mac

      - name: Notarize + staple DMG
        env:
          COMOTE_NOTARY_KEY_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          COMOTE_NOTARY_ISSUER_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
        run: node scripts/notarize-macos-dmg.mjs release/Comote-*-arm64.dmg

      - name: Clean up keychain
        if: always() && steps.cfg.outputs.signing == 'true'
        run: security delete-keychain "$RUNNER_TEMP/comote-signing.keychain-db" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Comote-arm64-dmg
          path: release/Comote-*-arm64.dmg
          if-no-files-found: error

  windows-x64:
    name: Comote Windows x64 installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Comote-win-x64-setup
          path: release/Comote-Setup-*-x64.exe
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    # Only the canonical repo can publish — forks lack the trusted-publisher
    # config on npmjs.com, so skip there instead of failing.
    if: github.ref_type == 'tag' && github.repository == 'GavinYangAI/Comote'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 still ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Publish via OIDC trusted publishing if version is new
        # No NODE_AUTH_TOKEN: the npm CLI auto-detects the GitHub Actions OIDC
        # environment and exchanges a short-lived token with the registry. The
        # package's trusted publisher (GitHub Actions → GavinYangAI/Comote →
        # desktop-release.yml) is configured on npmjs.com. Provenance is emitted
        # automatically, so no --provenance flag is needed.
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "comote@${VERSION}" version >/dev/null 2>&1; then
            echo "comote@${VERSION} is already on npm — nothing to publish."
            exit 0
          fi
          npm publish --access public

  publish-release:
    name: Publish GitHub Release
    needs: [mac-arm64, windows-x64]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Comote-arm64-dmg
          path: release-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Comote-win-x64-setup
          path: release-artifacts
      - name: Resolve release metadata and collect commit notes
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$REF_TYPE" = "tag" ]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported release tag: $REF_NAME" >&2
              exit 1
            fi
            RELEASE_TAG="$REF_NAME"
            PRERELEASE=false
            SEARCH_REVISION="${GITHUB_SHA}^"
          else
            RELEASE_TAG="v${VERSION}+build.${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
            SEARCH_REVISION="$GITHUB_SHA"
          fi

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 \
            --match 'v[0-9]*.[0-9]*.[0-9]*' \
            --exclude '*+*' --exclude '*-*' \
            "$SEARCH_REVISION" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ] && [[ ! "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Resolved non-stable previous tag: $PREVIOUS_TAG" >&2
            exit 1
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGE_RANGE="${PREVIOUS_TAG}..${GITHUB_SHA}"
            NOTES_HEADING="Changes since ${PREVIOUS_TAG}"
          else
            CHANGE_RANGE="$GITHUB_SHA"
            NOTES_HEADING="Changes"
          fi
          NOTES="$(git log --format='- %s (`%h`)' "$CHANGE_RANGE")"
          MAC_DMG="Comote-${VERSION}-arm64.dmg"
          WINDOWS_SETUP="Comote-Setup-${VERSION}-x64.exe"
          for ARTIFACT in "$MAC_DMG" "$WINDOWS_SETUP"; do
            if [ ! -f "release-artifacts/$ARTIFACT" ]; then
              echo "Expected release artifact missing: $ARTIFACT" >&2
              exit 1
            fi
          done
          RELEASE_DOWNLOAD_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          {
            printf '### %s\n\n' "$NOTES_HEADING"
            if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES"; else printf '%s\n' '- No commits in this range.'; fi
            printf '\n### Downloads / 下载\n\n'
            printf '| Platform / 平台 | Architecture / 架构 | Download / 下载 |\n'
            printf '| --- | --- | --- |\n'
            printf '| macOS | Apple Silicon (arm64) | [%s](%s/%s) |\n' "$MAC_DMG" "$RELEASE_DOWNLOAD_BASE" "$MAC_DMG"
            printf '| Windows | x64 | [%s](%s/%s) |\n\n' "$WINDOWS_SETUP" "$RELEASE_DOWNLOAD_BASE" "$WINDOWS_SETUP"
            printf 'See the [README](https://github.com/GavinYangAI/comote#readme) for installation and setup. / 安装与配置见 [README](https://github.com/GavinYangAI/comote#readme)。\n'
          } > RELEASE_BODY.md
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "----- release body -----"
          cat RELEASE_BODY.md
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: release-artifacts/*
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Comote ${{ steps.release.outputs.tag }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
